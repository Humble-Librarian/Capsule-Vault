<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Context Vault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <div class="header__logo">CV</div>
      <div class="header__info">
        <div class="header__title">Context Vault</div>
        <div class="header__sub" id="stats-label">loading...</div>
      </div>
    </div>
    <div class="header__actions">
      <button class="action-btn" id="btn-new" title="New memory">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="action-btn" id="btn-export" title="Export">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="action-btn" id="btn-import" title="Import">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <button class="action-btn action-btn--danger" id="btn-clear" title="Clear all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
    </div>
  </header>

  <div class="search-bar">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search-input" class="search-input" placeholder="Search memories..." autocomplete="off" spellcheck="false" />
    <button class="search-clear" id="btn-search-clear" title="Clear">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="list-wrapper">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div class="empty-title">No memories yet</div>
      <div class="empty-sub">Click the <strong>CV</strong> button on any page to capture context.</div>
    </div>
    <div class="list-container" id="memory-list"></div>
  </div>

  <div class="modal-overlay hidden" id="create-modal">
    <div class="modal">
      <div class="modal__header">
        <span class="modal__title">New Memory</span>
        <button class="modal__close" id="create-modal-close">&times;</button>
      </div>
      <div class="modal__body">
        <label class="form-label">Title <span class="form-hint">(optional)</span></label>
        <input type="text" class="form-input" id="new-title" placeholder="Auto-generated" maxlength="120" />
        <label class="form-label">Content</label>
        <textarea class="form-textarea" id="new-content" placeholder="Paste context..." maxlength="8000"></textarea>
        <label class="form-label">Tags <span class="form-hint">(comma-separated)</span></label>
        <input type="text" class="form-input" id="new-tags" placeholder="code, project, prompt" />
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" id="create-modal-cancel">Cancel</button>
        <button class="btn btn--primary" id="create-modal-save">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="view-modal">
    <div class="modal">
      <div class="modal__header">
        <span class="modal__title">Edit Memory</span>
        <button class="modal__close" id="view-modal-close">&times;</button>
      </div>
      <div class="modal__body">
        <label class="form-label">Title</label>
        <input type="text" class="form-input" id="edit-title" maxlength="120" />
        <label class="form-label">Content</label>
        <textarea class="form-textarea form-textarea--tall" id="edit-content" maxlength="8000"></textarea>
        <label class="form-label">Tags</label>
        <input type="text" class="form-input" id="edit-tags" />
        <label class="checkbox-row">
          <input type="checkbox" id="edit-pinned" />
          <span>Pin to top</span>
        </label>
      </div>
      <div class="modal__footer">
        <button class="btn btn--danger" id="edit-delete">Delete</button>
        <div style="flex:1"></div>
        <button class="btn btn--ghost" id="view-modal-cancel">Cancel</button>
        <button class="btn btn--primary" id="edit-save">Save</button>
      </div>
    </div>
  </div>

  <input type="file" id="import-file" accept=".json" style="display:none" />
  <script src="popup.js"></script>
</body>
</html>
